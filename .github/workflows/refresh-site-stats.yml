name: Refresh GoatCounter site total

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-goatcounter-site-total
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh cached count from GoatCounter
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const url = 'https://agamalx0.goatcounter.com/counter/TOTAL.json';
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) {
              throw new Error('GoatCounter returned HTTP ' + response.status);
            }

            const payload = await response.json();
            const count = String(payload.count ?? '').trim();
            if (!/^[0-9][0-9,]*$/.test(count)) {
              throw new Error('GoatCounter returned an invalid total count');
            }

            const path = 'assets/data/site-stats.json';
            let previous = {};
            try {
              previous = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (_) {}

            if (previous.count === count) {
              console.log('Site total is unchanged:', count);
              return;
            }

            const snapshot = {
              count,
              updated_at: new Date().toISOString()
            };
            fs.mkdirSync('assets/data', { recursive: true });
            fs.writeFileSync(path, JSON.stringify(snapshot, null, 2) + '\n');
            console.log('Updated site total to:', count);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit updated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/site-stats.json
          if git diff --cached --quiet; then
            echo "No visitor-count update to commit."
            exit 0
          fi
          git commit -m "Update cached GoatCounter site total"
          git push origin HEAD:main
